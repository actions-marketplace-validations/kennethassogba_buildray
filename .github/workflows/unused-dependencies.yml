name: Unused dependency corpus

on:
  workflow_call:
    inputs:
      target:
        type: string
        default: ''
      dependency:
        type: string
        default: ''
      project:
        type: string
        default: all
      incremental_only:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      target:
        type: string
        default: ''
      dependency:
        type: string
        default: ''
      project:
        description: Project to evaluate.
        type: choice
        options: [all, xgrammar, sentencepiece, mujoco, snappy, llama]
        default: all
      incremental_only:
        description: Keep full build and test validation; measure only incremental rebuild pairs.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  evaluate:
    name: ${{ matrix.project }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: xgrammar
            repository: mlc-ai/xgrammar
            revision: 7e269d56c74c89de52bc8c31e42191155416371f
            jobs: '2'
            rebuild_files: '["cpp/earley_parser.cc", "3rdparty/googletest/googlemock/src/gmock-all.cc"]'
            cmake_args: '[]'
          - project: sentencepiece
            repository: google/sentencepiece
            revision: e0cce7d37b065b5140349dbe12c6bcf6192fdd78
            jobs: '2'
            rebuild_files: '["src/sentencepiece_processor.cc"]'
            cmake_args: '["-DSPM_BUILD_TEST=ON", "-DSPM_ENABLE_SHARED=OFF", "-DSPM_ENABLE_TCMALLOC=OFF"]'
          - project: mujoco
            repository: google-deepmind/mujoco
            revision: 651bae11c3c38efe483f033b4b7e869e7ce3f4ec
            jobs: '4'
            rebuild_files: '["test/compare_model.cc", "test/fixture.cc"]'
            cmake_args: '["-DMUJOCO_BUILD_EXAMPLES=OFF", "-DMUJOCO_BUILD_SIMULATE=OFF", "-DMUJOCO_BUILD_TESTS=ON", "-DMUJOCO_TEST_PYTHON_UTIL=OFF", "-DCMAKE_CXX_SCAN_FOR_MODULES=OFF", "-DCMAKE_LINK_DEPENDS_USE_LINKER=OFF"]'
          - project: snappy
            repository: google/snappy
            revision: 9c28114a38866f6deeaa826db918293bc28ae410
            jobs: '4'
            rebuild_files: '["snappy.cc", "snappy-test.cc"]'
            cmake_args: '["-DBUILD_SHARED_LIBS=OFF", "-DSNAPPY_BUILD_TESTS=ON", "-DSNAPPY_BUILD_BENCHMARKS=ON"]'
          - project: llama
            repository: ggml-org/llama.cpp
            revision: 36cbf415f1c72c199e956c00fed0418f22ca53f2
            jobs: '4'
            rebuild_files: '["common/common.cpp", "src/llama-vocab.cpp"]'
            cmake_args: '["-DBUILD_SHARED_LIBS=OFF", "-DLLAMA_BUILD_TESTS=ON", "-DLLAMA_BUILD_EXAMPLES=OFF", "-DLLAMA_BUILD_TOOLS=ON", "-DLLAMA_BUILD_SERVER=ON", "-DLLAMA_BUILD_APP=OFF", "-DCMAKE_PROJECT_llama.cpp_INCLUDE=buildray-benchmark.cmake", "-DGGML_NATIVE=OFF", "-DGGML_CUDA=OFF", "-DGGML_BACKEND_DL=OFF"]'
    steps:
      - uses: actions/checkout@v6
        if: inputs.project == 'all' || inputs.project == matrix.project
      - uses: actions/setup-python@v7
        if: inputs.project == 'all' || inputs.project == matrix.project
        with:
          python-version: '3.12'
      - uses: actions/checkout@v6
        if: inputs.project == 'all' || inputs.project == matrix.project
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.revision }}
          path: fixtures/${{ matrix.project }}
          persist-credentials: false
      - name: Prepare XGrammar tests
        if: (inputs.project == 'all' || inputs.project == matrix.project) && matrix.project == 'xgrammar'
        working-directory: fixtures/xgrammar
        run: |
          git submodule update --init --depth 1 3rdparty/dlpack 3rdparty/googletest
          printf '%s\n' 'set(XGRAMMAR_BUILD_PYTHON_BINDINGS OFF)' 'set(XGRAMMAR_BUILD_CXX_TESTS ON)' > config.cmake
      - name: Prepare MuJoCo locale
        if: (inputs.project == 'all' || inputs.project == matrix.project) && matrix.project == 'mujoco'
        run: sudo locale-gen de_DE.UTF-8
      - name: Prepare Snappy tests and benchmarks
        if: (inputs.project == 'all' || inputs.project == matrix.project) && matrix.project == 'snappy'
        working-directory: fixtures/snappy
        run: git submodule update --init --depth 1 third_party/googletest third_party/benchmark
      - name: Prepare llama.cpp Python test dependencies
        if: (inputs.project == 'all' || inputs.project == matrix.project) && matrix.project == 'llama'
        run: |
          python3 -m pip install jinja2 jsonschema requests
          # llama sets UNITY_BUILD on the target, overriding CMAKE_UNITY_BUILD.
          # Keep the same explicit non-Unity profile in both measured variants.
          printf '%s\n' 'cmake_language(DEFER CALL set_property TARGET llama PROPERTY UNITY_BUILD OFF)' > fixtures/llama/buildray-benchmark.cmake
      - name: Select a common LLD toolchain for both variants
        if: inputs.project == 'all' || inputs.project == matrix.project
        env:
          PROJECT_ARGS: ${{ matrix.cmake_args }}
        run: |
          python3 - <<'PY'
          import json, os
          args = json.loads(os.environ['PROJECT_ARGS'])
          for kind in ['EXE', 'SHARED', 'MODULE']:
              args.append(f'-DCMAKE_{kind}_LINKER_FLAGS=--ld-path=/usr/lib/llvm-21/bin/ld.lld')
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('UNUSED_CMAKE_ARGS=' + json.dumps(args) + '\n')
          PY
      - name: Validate and measure unused static dependencies
        if: inputs.project == 'all' || inputs.project == matrix.project
        uses: ./
        with:
          command: prune-deps
          link-target: ${{ inputs.target }}
          link-dependency: ${{ inputs.dependency }}
          source: fixtures/${{ matrix.project }}
          runs: '3'
          jobs: ${{ matrix.jobs }}
          rebuild-files: ${{ matrix.rebuild_files }}
          incremental-only: ${{ inputs.incremental_only }}
          allow-baseline-skips: 'true'
          max-dependency-trials: '128'
          dependency-time-budget: '1800'
          exclude-paths: '["3rdparty", "third_party"]'
          cmake-args: ${{ env.UNUSED_CMAKE_ARGS }}
          artifact-name: unused-${{ matrix.project }}
      - name: Keep raw logs if validation fails or is cancelled
        if: (failure() || cancelled()) && (inputs.project == 'all' || inputs.project == matrix.project)
        uses: actions/upload-artifact@v7
        with:
          name: unused-${{ matrix.project }}-incomplete-logs
          path: ${{ runner.temp }}/buildray-action-*/run/logs/
          if-no-files-found: warn
